[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-map"
version = "0.1.0"
description = "Dependency-aware infrastructure deadline and blast-radius monitor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
deadline-map = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
